name: Build APK
on:
  push:
    paths-ignore:
      - 'store/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Signing with the fixed keystore"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK gets a random key and cannot update the installed app"
          fi
      - run: flutter create . --platforms=android --org com.mn20091211
      - run: bash tool/patch_android.sh
      - run: flutter pub get
      - run: >
          flutter build apk --release --target-platform android-arm64
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=REPO=${{ github.repository }}
          --dart-define=SUPPORT_URL=${{ vars.SUPPORT_URL }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk pkg-sender.apk
          gh release create "v1.0.${{ github.run_number }}" pkg-sender.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "v1.0.${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }}"
      - name: Publish update info (read by the app, no API limits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          printf '{"build": %s, "tag": "%s", "apk": "https://github.com/%s/releases/download/%s/pkg-sender.apk", "page": "https://github.com/%s/releases/tag/%s"}\n' \
            "${{ github.run_number }}" "$TAG" "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_REPOSITORY" "$TAG" > latest.json
          cat latest.json
          gh release view app-meta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create app-meta --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Update info" --notes "Version information read by the app"
          gh release upload app-meta latest.json --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-sender-apk
          path: build/app/outputs/flutter-apk/app-release.apk
